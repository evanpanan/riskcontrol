# RiskControl 单机部署编排：PostgreSQL + 应用 + 闪跌监控
# 用法：
#   1) 在服务器上创建 .env（参考 .env.production.example），至少设置
#      POSTGRES_PASSWORD、NEXT_RC_AUTH_SECRET
#   2) docker compose up -d --build
#   3) 首次初始化账号：在 .env 中设置 RC_ALLOW_SEED=1 与逐账号 RC_SEED_PASSWORDS（JSON），
#      再 `docker compose up -d --force-recreate app`；完成后请改回 RC_ALLOW_SEED=0。
#
# 说明：本地未安装 Docker，本文件尚未在本机验证，首次部署请留意容器日志。

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://rc_app:${POSTGRES_PASSWORD}@db:5432/risk_control
  DIRECT_DATABASE_URL: postgresql://rc_app:${POSTGRES_PASSWORD}@db:5432/risk_control
  NEXT_RC_AUTH_SECRET: ${NEXT_RC_AUTH_SECRET:?请在 .env 中设置 NEXT_RC_AUTH_SECRET}
  RC_ENABLE_DEV_MOCK_ACCOUNTS: "0"
  # 账号初始化需显式授权，且生产必须逐账号指定口令（禁止共享口令）。
  RC_ALLOW_SEED: ${RC_ALLOW_SEED:-0}
  RC_SEED_PASSWORDS: ${RC_SEED_PASSWORDS:-}
  RC_SEED_FORCE_PASSWORD: ${RC_SEED_FORCE_PASSWORD:-0}
  EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
  WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
  NOTIFICATION_SEND_TOKEN: ${NOTIFICATION_SEND_TOKEN:-}
  NEXT_PUBLIC_STOCK_API_KEY: ${NEXT_PUBLIC_STOCK_API_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: risk_control
      POSTGRES_USER: rc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - rc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc_app -d risk_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 仅容器网络内可达，不对公网暴露 5432
    expose:
      - "5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      # 宿主端口可覆盖：APP_HOST_PORT=3100 docker compose up -d
      - "${APP_HOST_PORT:-3000}:3000"
    # 就绪探针：容器先跑 migrate deploy + preflight 才起 next start，
    # 因此 start_period 需覆盖迁移耗时（首次部署库为空时更久）。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # 服务端闪跌监控：独立于浏览器持续采集行情、检测闪跌并投递预警。
  # 与 app 共用镜像，仅覆盖启动命令；单机试点可与 app 同机运行。
  # 依赖 app 就绪（迁移已完成）再启动，避免空库首次部署时读到不存在的表。
  monitor:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      RC_MONITOR_INTERVAL_SEC: ${RC_MONITOR_INTERVAL_SEC:-30}
    command: ["npx", "tsx", "scripts/flash-monitor.ts"]

volumes:
  rc_pgdata:
